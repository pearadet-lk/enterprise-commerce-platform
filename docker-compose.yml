services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ecp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ecp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./src/backend/Database/init.sql:/init.sql
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Your_strong_Password123' -C -i /init.sql &&
      echo 'Database initialization complete'"
    restart: "no"

  identity:
    build:
      context: .
      dockerfile: src/backend/Identity/IdentityServer.Host/Dockerfile
    container_name: ecp-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5001:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  catalog-api:
    build:
      context: .
      dockerfile: src/backend/Services/Catalog.API/Dockerfile
    container_name: ecp-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5101:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started

  orders-api:
    build:
      context: .
      dockerfile: src/backend/Services/Orders.API/Dockerfile
    container_name: ecp-orders-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5102:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
      catalog-api:
        condition: service_started

  users-api:
    build:
      context: .
      dockerfile: src/backend/Services/Users.API/Dockerfile
    container_name: ecp-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5103:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: src/backend/ApiGateway/Dockerfile
    container_name: ecp-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "7000:8080"
    depends_on:
      - catalog-api
      - orders-api
      - users-api
      - identity

  angular:
    build:
      context: ./src/frontend/angular-spa
      dockerfile: Dockerfile
    container_name: ecp-angular
    ports:
      - "4200:80"
    depends_on:
      - gateway
      - identity

volumes:
  sqlserver-data:
