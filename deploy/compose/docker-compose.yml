# Mode: Docker Compose (project name: enterprise-commerce-platform)
# External ports: 9200, 5001, 7000, 5101-5103, 1433, 16686
# Do not run together with Kubernetes overlays (see deploy/README.md).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ecp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ecp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../../src/backend/Database/init.sql:/init.sql
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Your_strong_Password123' -C -i /init.sql &&
      echo 'Database initialization complete'"
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: ecp-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  identity:
    build:
      context: ../..
      dockerfile: src/backend/Identity/IdentityServer.Host/Dockerfile
    image: ecp/identity-server:compose
    container_name: ecp-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ECP_DEPLOY_MODE: compose
    expose:
      - "8080"
    volumes:
      - identity-dpkeys:/app/dpkeys
    depends_on:
      db-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  duende-ui:
    build:
      context: ../../docker/duende-ui
    image: ecp/duende-ui:compose
    container_name: ecp-duende-ui
    ports:
      - "5001:80"
    depends_on:
      - identity

  catalog-api:
    build:
      context: ../..
      dockerfile: src/backend/Services/Catalog.API/Dockerfile
    image: ecp/catalog-api:compose
    container_name: ecp-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ECP_DEPLOY_MODE: compose
    ports:
      - "5101:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
      jaeger:
        condition: service_started

  orders-api:
    build:
      context: ../..
      dockerfile: src/backend/Services/Orders.API/Dockerfile
    image: ecp/orders-api:compose
    container_name: ecp-orders-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ECP_DEPLOY_MODE: compose
    ports:
      - "5102:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
      catalog-api:
        condition: service_started
      jaeger:
        condition: service_started

  users-api:
    build:
      context: ../..
      dockerfile: src/backend/Services/Users.API/Dockerfile
    image: ecp/users-api:compose
    container_name: ecp-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ECP_DEPLOY_MODE: compose
    ports:
      - "5103:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
      jaeger:
        condition: service_started

  gateway:
    build:
      context: ../..
      dockerfile: src/backend/ApiGateway/Dockerfile
    image: ecp/gateway:compose
    container_name: ecp-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ECP_DEPLOY_MODE: compose
    ports:
      - "7000:8080"
    depends_on:
      - catalog-api
      - orders-api
      - users-api
      - identity
      - jaeger

  angular:
    build:
      context: ../../src/frontend/angular-spa
      dockerfile: Dockerfile
    image: ecp/angular-spa:compose
    container_name: ecp-angular
    ports:
      - "9200:80"
    depends_on:
      - gateway
      - duende-ui

volumes:
  sqlserver-data:
  identity-dpkeys:
