apiVersion: v1
kind: ConfigMap
metadata:
  name: duende-ui-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            proxy_pass http://identity:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duende-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duende-ui
  template:
    metadata:
      labels:
        app: duende-ui
    spec:
      containers:
        - name: ecp-duende-ui
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: duende-ui-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: duende-ui
spec:
  selector:
    app: duende-ui
  ports:
    - port: 80
      targetPort: 80
