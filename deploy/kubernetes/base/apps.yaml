apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: ecp-catalog-api
          image: ecp/catalog-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Kubernetes
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Identity__ValidIssuer
              valueFrom:
                configMapKeyRef:
                  name: platform-env
                  key: IDENTITY_PUBLIC_URL
            - name: Cors__AllowedOriginsCsv
              valueFrom:
                configMapKeyRef:
                  name: platform-env
                  key: CORS_ALLOWED_ORIGINS

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
spec:
  selector:
    app: catalog-api
  ports:
    - port: 8080
      targetPort: 8080

