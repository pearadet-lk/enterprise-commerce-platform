apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ecp-db-init
          image: mcr.microsoft.com/mssql/server:2025-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-credentials
                  key: SA_PASSWORD
          command:
            - /bin/bash
            - -c
            - |
              until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"; do
                echo "Waiting for SQL Server..."
                sleep 5
              done
              /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -C -i /scripts/init.sql
              echo "Database initialization complete"
          volumeMounts:
            - name: init-sql
              mountPath: /scripts
      volumes:
        - name: init-sql
          configMap:
            name: db-init-sql
